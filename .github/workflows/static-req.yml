name: static-req

# 정적 요구사항(docs/요구사항/정적/)과 그 보호 장치를 바꾼 PR 은 `정적 요구사항 변경` 라벨이 있어야 통과한다.
# 라벨을 달거나 떼면(labeled, unlabeled) 다시 돈다. 바뀐 것이 없으면 늘 통과하므로 필수 검사로 걸어도 된다.
#
# pr-form 과 같은 까닭으로 pull_request_target 을 쓴다. 작업 파일과 스크립트를 main 에서 가져오므로
# PR 이 이 파일이나 스크립트를 고쳐 스스로 통과시킬 수 없다.
# 🔴 PR 쪽 코드를 받아 실행하지 않는다. 바뀐 파일 목록은 API 로만 읽는다.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  static-req:
    name: static-req
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: 정적 요구사항 변경 검사
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/check_static_req.py
